name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20.x
          - os: ubuntu-latest
            node-version: 22.x
          - os: ubuntu-latest
            node-version: 24.x
          - os: ubuntu-latest
            node-version: 26.x
          - os: ubuntu-22.04-arm
            node-version: 24.x
          - os: macos-15-intel
            node-version: 24.x
          - os: macos-15
            node-version: 24.x
          - os: windows-2025
            node-version: 24.x
          - os: windows-11-arm
            node-version: 24.x

    defaults:
      run:
        working-directory: maxminddb-node

    steps:
      - name: Checkout maxminddb-node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: maxminddb-node
          persist-credentials: false

      - name: Checkout MaxMind DB Rust test data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oschwald/maxminddb-rust
          # Pinned so that changes to maxminddb-rust cannot break CI or a
          # release without a commit here. Bump deliberately, and keep this in
          # sync with the same checkout in publish.yml.
          ref: dffc914957544b371ed014c222c74942b1e620e2
          path: maxminddb-rust
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: maxminddb-node/package-lock.json

      - name: Setup Rust
        run: |
          rustup default stable
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Check Rust
        run: cargo check

      - name: Test Rust
        run: cargo test --lib

      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Build native module
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check npm package
        run: npm pack --dry-run

      - name: Test packed package
        run: npm run test:pack
