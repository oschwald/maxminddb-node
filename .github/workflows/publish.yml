name: Publish

on:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - Cargo.lock
      - Cargo.toml
      - build.rs
      - index.js
      - package-lock.json
      - package.json
      - src/**
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Run npm publish after validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x64-gnu
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            libc: gnu
            build_args: --use-napi-cross
          - artifact: linux-arm64-gnu
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            libc: gnu
            build_args: --use-napi-cross
          - artifact: linux-x64-musl
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            libc: musl
          - artifact: linux-arm64-musl
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            libc: musl
          - artifact: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            macos_deployment_target: "10.13"
          - artifact: darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: "11.0"
          - artifact: win32-x64-msvc
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - artifact: win32-arm64-msvc
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    defaults:
      run:
        # The steps read their inputs from environment variables, so use the
        # same shell on Windows as elsewhere.
        shell: bash

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      TARGET: ${{ matrix.target }}
      BUILD_ARGS: ${{ matrix.build_args }}
      # Highest glibc symbol version the gnu addons may require. The napi-rs
      # cross toolchain links against glibc 2.17.
      GLIBC_FLOOR: "2.17"
      # Images used to build and test outside the runner's own libc.
      ALPINE_NODE_IMAGE: node:24-alpine
      OLD_GLIBC_IMAGE: almalinux:8
      SMOKE_TEST: >-
        const pkg = require('./package.json');
        const maxminddb = require('./');
        if (maxminddb.nativeVersion() !== pkg.version)
        throw new Error('native version mismatch')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Rust
        if: ${{ matrix.libc != 'musl' }}
        run: |
          rustup default stable
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"

      - name: Install dependencies
        if: ${{ matrix.libc != 'musl' }}
        run: npm ci

      - name: Build native module
        if: ${{ matrix.libc != 'musl' }}
        # BUILD_ARGS is intentionally unquoted so that it can hold several
        # arguments.
        run: npx napi build --target "$TARGET" $BUILD_ARGS --platform --release --no-js --dts native.d.ts

      - name: Build and smoke test native module on Alpine
        if: ${{ matrix.libc == 'musl' }}
        # The runner cannot load a musl addon, so build and test it inside an
        # Alpine container of the same architecture. The loader tests also run
        # there so that musl detection is checked on a real musl system.
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e TARGET -e SMOKE_TEST \
            "$ALPINE_NODE_IMAGE" sh -euxc '
              apk add --no-cache build-base rustup
              rustup-init -y --profile minimal --default-toolchain stable --no-modify-path
              export PATH="$HOME/.cargo/bin:$PATH"
              # napi defaults some musl targets to a cross linker such as
              # aarch64-linux-musl-gcc; this build is native, so use gcc.
              export "CARGO_TARGET_$(echo "$TARGET" | tr a-z- A-Z_)_LINKER=gcc"
              npm ci
              npx napi build --target "$TARGET" --platform --release --no-js --dts native.d.ts
              node -e "$SMOKE_TEST"
              node --test test/native-loader.test.js
            '

      - name: Check glibc floor
        if: ${{ matrix.libc == 'gnu' }}
        run: |
          required="$(objdump -T index.*.node | { grep -o 'GLIBC_[0-9][0-9.]*' || true; } | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "Highest required glibc symbol version: ${required:-none}"
          if [ -n "$required" ] && [ "$(printf '%s\n%s\n' "$required" "$GLIBC_FLOOR" | sort -V | tail -n 1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::Native module requires glibc $required, above the $GLIBC_FLOOR floor"
            exit 1
          fi

      - name: Smoke test native module
        if: ${{ matrix.libc != 'musl' }}
        run: node -e "$SMOKE_TEST"

      - name: Smoke test native module on glibc 2.28
        if: ${{ matrix.libc == 'gnu' }}
        # glibc 2.28 (RHEL 8) is the oldest glibc that official Node.js 20,
        # 22, and 24 Linux builds run on. Reuse the runner's Node.js inside an
        # AlmaLinux 8 container to check that the addon loads there.
        run: |
          node_dir="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          docker run --rm \
            -v "$PWD:/work:ro" -w /work \
            -v "$node_dir:/opt/node:ro" \
            -e SMOKE_TEST \
            "$OLD_GLIBC_IMAGE" sh -euxc '
              ldd --version | head -n 1
              /opt/node/bin/node -e "$SMOKE_TEST"
            '

      - name: Upload native module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.artifact }}
          path: index.*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    # Pull requests only check that the native modules build.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs:
      - build-binaries

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: maxminddb-node

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: maxminddb-node
          persist-credentials: false

      - name: Checkout MaxMind DB Rust test data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oschwald/maxminddb-rust
          path: maxminddb-rust
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Rust
        run: |
          rustup default stable
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Download native modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: true

      - name: Assemble native modules
        run: |
          cp ../native-artifacts/*.node .
          test -f index.linux-x64-gnu.node
          test -f index.linux-arm64-gnu.node
          test -f index.linux-x64-musl.node
          test -f index.linux-arm64-musl.node
          test -f index.darwin-x64.node
          test -f index.darwin-arm64.node
          test -f index.win32-x64-msvc.node
          test -f index.win32-arm64-msvc.node
          ls -1 *.node

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Check Rust
        run: cargo check

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check npm package
        run: npm pack --dry-run

      - name: Test packed package
        run: npm run test:pack

      - name: Publish package
        if: ${{ github.event_name == 'release' || inputs.publish }}
        run: npm publish --access public
