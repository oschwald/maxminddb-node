[package]
name = "maxminddb-node"
version = "0.4.0"
edition = "2021"
license = "ISC"
description = "Rust-backed Node.js reader for MaxMind DB files"

[lib]
crate-type = ["cdylib"]
name = "maxminddb_node"

[dependencies]
arrayvec = "0.7.8"
ipnetwork = "0.21.1"
lru = "0.18.4"
maxminddb = { version = "0.32.0", features = ["mmap"] }
memmap2 = "0.9.11"
napi = { version = "3.12.4", default-features = false, features = ["napi8"] }
napi-derive = "3.6.5"
self_cell = "1.3.0"
serde = "1.0.229"

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
codegen-units = 1
lto = "thin"
